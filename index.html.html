<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حاسبتي | CalcMate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

  :root{
    --ink:#0C0C0C;
    --navy:#2A3142;
    --slate:#61718A;
    --slate-light:#8C97A9;
    --grey:#8A9098;
    --grey-light:#A0A5B0;
    --bg:#EFF0F2;
    --card:#FFFFFF;
    --green:#3D7A54;
    --red:#A23B2E;
    --border:#DADCE1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', 'Cairo', sans-serif;
    font-size:16px;
    line-height:1.5;
  }
  h1,h2,h3{font-family:'Cairo', sans-serif;}

  header{
    background:var(--navy);
    color:#fff;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  header .brand{display:flex; align-items:baseline; gap:10px;}
  header h1{font-size:22px; margin:0; font-weight:800;}
  header .tagline{font-size:12.5px; color:#C7CDDA; margin-top:2px;}
  header .right{display:flex; align-items:center; gap:14px;}
  header label{font-size:12.5px; color:#C7CDDA; display:flex; align-items:center; gap:6px;}
  header input{
    width:70px; border-radius:8px; border:1px solid var(--slate-light);
    padding:5px 8px; font-size:14px; background:#fff; color:var(--ink);
  }
  #save-status{font-size:12px; color:#C7CDDA;}

  .layout{display:flex; align-items:flex-start; flex-wrap:wrap;}
  nav{
    width:230px; flex-shrink:0; display:flex; flex-direction:column; gap:4px;
    padding:16px; border-left:1px solid var(--border);
    background:#fff;
    min-height:calc(100vh - 74px);
  }
  @media (max-width:800px){
    nav{width:100%; flex-direction:row; overflow-x:auto; min-height:auto; border-left:none; border-bottom:1px solid var(--border);}
  }
  nav button{
    display:flex; align-items:center; gap:10px;
    background:transparent; border:none; text-align:right;
    padding:11px 14px; border-radius:10px; font-size:14.5px; font-weight:700;
    color:var(--ink); cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  nav button.active{background:var(--slate); color:#fff;}
  nav button:hover:not(.active){background:var(--bg);}

  main{flex:1; padding:22px; min-width:0;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:14px;}
  .muted{color:var(--grey);}
  .hint{font-size:12.5px; color:var(--grey); margin-top:3px;}

  .guide{
    background:#fff; border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; margin-bottom:18px;
  }
  .guide h3{margin:0 0 8px; font-size:16px; color:var(--navy); cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .guide ol{margin:10px 0 0; padding-inline-start:20px; font-size:14.5px;}
  .guide li{margin-bottom:6px;}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  @media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat{padding:16px; display:flex; flex-direction:column; gap:8px;}
  .stat .label{font-size:13px; color:var(--grey);}
  .stat .value{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums;}

  .summary-box{display:flex; gap:20px; align-items:center; padding:20px; margin-bottom:18px; flex-wrap:wrap;}
  .stamp{
    width:88px; height:88px; border-radius:50%; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:3px double var(--navy); transform:rotate(-7deg);
  }
  .stamp .p{font-size:19px; font-weight:800; line-height:1;}
  .stamp .l{font-size:10px; margin-top:4px;}
  .ledger{flex:1; min-width:220px;}
  .ledger-row{display:flex; align-items:baseline; gap:8px; padding:5px 0;}
  .ledger-row .lbl{font-size:14px; color:var(--grey); white-space:nowrap;}
  .ledger-row .fill{flex:1; border-bottom:1px dotted var(--border); transform:translateY(-4px);}
  .ledger-row .val{font-variant-numeric:tabular-nums; font-size:14.5px;}
  .ledger-row .val.bold{font-weight:800; font-size:16px;}
  .ledger-row input.ledger-input{
    width:120px; text-align:right; border:1px solid var(--border); border-radius:7px;
    padding:5px 8px; font-size:14.5px; font-family:inherit; color:var(--ink);
    font-variant-numeric:tabular-nums; background:#fff;
  }

  table{width:100%; border-collapse:collapse; font-size:14.5px; font-variant-numeric:tabular-nums;}
  thead th{text-align:right; color:var(--grey); font-weight:600; padding:10px 14px; font-size:12.5px;}
  tbody td, tfoot td{padding:9px 14px; border-top:1px solid var(--border);}
  tfoot td{border-top:2px solid var(--ink); font-weight:800;}
  .table-title{padding:13px 16px; font-weight:800; background:var(--bg); border-bottom:1px solid var(--border); border-radius:14px 14px 0 0;}
  .empty{padding:30px 16px; text-align:center; color:var(--grey); font-size:14.5px;}

  .btn{
    border:none; border-radius:10px; padding:10px 16px; font-size:14.5px; font-weight:800;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:inherit;
  }
  .btn-primary{background:var(--slate); color:#fff;}
  .btn-primary:hover{background:var(--navy);}
  .btn-ghost{background:transparent; color:var(--slate); border:1px solid var(--slate-light);}
  .icon-btn{background:transparent; border:none; cursor:pointer; color:var(--red); padding:5px; border-radius:6px;}
  .icon-btn:hover{background:#F6E9E7;}
  .icon-btn.grey{color:var(--grey);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .section-head h2{font-size:19px; margin:0; color:var(--navy);}

  .product-card{margin-bottom:14px; overflow:hidden;}
  .product-head{display:flex; align-items:center; gap:10px; padding:13px 16px; background:var(--bg); cursor:pointer;}
  .product-head input.name-input{
    flex:1; background:transparent; border:none; font-weight:800; font-size:16px; color:var(--ink); font-family:inherit;
  }
  .badge{background:var(--navy); color:#fff; font-size:12px; padding:4px 10px; border-radius:999px; white-space:nowrap;}
  .product-body{padding:18px;}

  .field-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
  @media (max-width:800px){.field-grid{grid-template-columns:repeat(2,1fr);}}
  .field label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--grey); font-weight:600;}
  .field input, .field select{
    border:1px solid var(--border); border-radius:9px; padding:9px 10px; font-size:14.5px; font-family:inherit; color:var(--ink);
  }
  input:focus, select:focus, button:focus-visible{outline:2px solid var(--slate); outline-offset:1px;}

  .mat-head{display:grid; grid-template-columns:3fr 1.4fr 1.2fr 1.4fr 1.3fr 32px; gap:8px; font-size:11.5px; color:var(--grey); padding:0 2px 6px;}
  .mat-row{display:grid; grid-template-columns:3fr 1.4fr 1.2fr 1.4fr 1.3fr 32px; gap:8px; align-items:center; margin-bottom:8px;}
  .mat-row input, .mat-row select{border:1px solid var(--border); border-radius:8px; padding:7px 8px; font-size:14px; width:100%; font-family:inherit;}
  .mat-cost{font-weight:800; font-size:14px;}

  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:24px; padding-top:14px; border-top:1px solid var(--border); margin-top:6px;}
  @media (max-width:700px){.two-col{grid-template-columns:1fr;}}

  .row-grid{display:grid; grid-template-columns:5fr 2fr 2fr 2fr 32px; gap:8px; align-items:center; padding:10px 16px; border-top:1px solid var(--border);}
  .row-grid input{border:1px solid var(--border); border-radius:8px; padding:7px 9px; font-size:14px; width:100%; font-family:inherit;}
  .row-head{display:grid; grid-template-columns:5fr 2fr 2fr 2fr 32px; gap:8px; padding:10px 16px; font-size:11.5px; color:var(--grey); background:var(--bg);}
  .foot-row{display:flex; justify-content:space-between; padding:12px 16px; font-weight:800; background:var(--bg); border-top:1px solid var(--ink);}

  .total-banner{background:var(--navy); color:#fff; border-radius:14px; padding:16px 18px; font-weight:800; display:flex; justify-content:space-between; font-size:16px; margin-top:20px;}

  .intro-text{font-size:14.5px; color:var(--grey); margin-bottom:16px; max-width:640px;}

  /* ============ تسجيل الدخول ============ */
  #auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .auth-card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:30px; width:100%; max-width:360px;
  }
  .auth-card h2{margin:0 0 4px; font-size:20px; color:var(--navy);}
  .auth-card .sub{font-size:13px; color:var(--grey); margin-bottom:20px;}
  .auth-field{margin-bottom:14px;}
  .auth-field label{display:block; font-size:12.5px; color:var(--grey); font-weight:600; margin-bottom:5px;}
  .auth-field input{
    width:100%; border:1px solid var(--border); border-radius:9px; padding:10px 12px;
    font-size:14.5px; font-family:inherit; color:var(--ink);
  }
  .auth-error{color:var(--red); font-size:13px; margin:6px 0 10px; min-height:16px;}
  .auth-switch{text-align:center; margin-top:16px; font-size:13.5px; color:var(--grey);}
  .auth-switch a{color:var(--slate); cursor:pointer; font-weight:700; text-decoration:none;}
  .btn-block{width:100%; justify-content:center;}

  .account-box{display:flex; align-items:center; gap:10px;}
  .account-box .who{font-size:13px; color:#C7CDDA;}
  .logout-btn{
    background:transparent; border:1px solid #4E5A72; color:#fff; border-radius:8px;
    padding:6px 12px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .logout-btn:hover{background:#3A4257;}

  /* ============ توصيات الذكاء الاصطناعي ============ */
  .ai-box{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .ai-box input{
    flex:1; min-width:220px; border:1px solid var(--border); border-radius:9px;
    padding:10px 12px; font-size:14.5px; font-family:inherit;
  }
  .ai-result-card{margin-bottom:14px; padding:16px 18px;}
  .ai-result-card h4{margin:0 0 6px; font-size:14px; color:var(--navy);}
  .ai-result-card .item{padding:8px 0; border-top:1px solid var(--border);}
  .ai-result-card .item:first-child{border-top:none;}
  .ai-result-card .item .n{font-weight:800; font-size:14.5px;}
  .ai-result-card .item .r{font-size:13px; color:var(--grey); margin-top:2px;}
  .ai-loading{color:var(--grey); font-size:14px; padding:10px 0;}
</style>
</head>
<body>

<!-- ============ شاشة تسجيل الدخول / إنشاء حساب ============ -->
<div id="auth-screen" style="display:none;">
  <div class="auth-card">
    <h2 id="auth-title">تسجيل الدخول</h2>
    <div class="sub" id="auth-sub">سجّل دخولك عشان بياناتك تتحفظ أونلاين</div>

    <div id="auth-signup-fields" style="display:none;">
      <div class="auth-field">
        <label>الاسم</label>
        <input type="text" id="auth-name" placeholder="اسمك">
      </div>
    </div>

    <div class="auth-field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="auth-email" placeholder="example@email.com">
    </div>
    <div class="auth-field">
      <label>كلمة المرور</label>
      <input type="password" id="auth-password" placeholder="6 أحرف على الأقل">
    </div>

    <div class="auth-error" id="auth-error"></div>

    <button class="btn btn-primary btn-block" id="auth-submit-btn" onclick="submitAuth()">دخول</button>

    <div class="auth-switch">
      <span id="auth-switch-text">لسه معكيش حساب؟</span>
      <a onclick="toggleAuthMode()" id="auth-switch-link">اعمل حساب جديد</a>
    </div>
  </div>
</div>

<!-- ============ الموقع نفسه (يظهر بعد تسجيل الدخول) ============ -->
<div id="app-screen" style="display:none;">
  <header>
    <div class="brand">
      <div>
        <h1>حاسبتي <span style="font-weight:400; color:#C7CDDA; font-size:14px;">CalcMate</span></h1>
        <div class="tagline">تعرف تكلفة وأرباح مشروعك في دقايق، من غير حسابات يدوية</div>
      </div>
    </div>
    <div class="right account-box">
      <span id="save-status"></span>
      <span class="who" id="who-am-i"></span>
      <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
    </div>
  </header>

  <div class="layout">
    <nav id="tabs"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
/* ============ بيانات ثابتة ============ */
const UNIT_LIST = ["كجم","جم","لتر","مل","قطعة","علبة","كرتونة","كيس","شكارة","زجاجة","دستة","متر","رول","دقيقة","ساعة","جلسة","يوم"];
const CURRENCY = "جنيه";

// رابط الباك إند بتاعك على Railway — غيّريه لو غيّرتي الاستضافة
const API_BASE_URL = "https://calcmate-backend-production.up.railway.app";
const TOKEN_KEY = "calcmate-token";
const USER_KEY = "calcmate-user";

let state = { products:[], workers:[], expenses:[] };
let activeTab = "dashboard";
let expandedProducts = new Set();
let showGuide = true;
let saveTimer = null;
let authMode = "login"; // "login" or "signup"
let aiResult = null;
let aiLoading = false;

/* ============ أدوات مساعدة ============ */
function uid(){ return Math.random().toString(36).slice(2,10); }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }
function fmt(v,d=2){ return num(v).toLocaleString("ar-EG",{minimumFractionDigits:0, maximumFractionDigits:d}); }
function esc(s){
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function computeProduct(p){
  const materialsCost = p.materials.reduce((s,m)=> s + num(m.qty)*num(m.unitPrice), 0);
  const wasteCost = materialsCost * (num(p.wastePercent)/100);
  const samplesCost = num(p.samplesCost); /* تكلفة العينات: قيمة يدخلها المستخدم مباشرة */
  const totalCost = materialsCost + wasteCost + samplesCost;
  const batch = num(p.batchSize) || 1;
  const costPerUnit = totalCost / batch;
  const sellingPrice = p.priceMode === "margin"
    ? costPerUnit * (1 + num(p.marginPercent)/100)
    : num(p.sellingPrice);
  const unitsSold = num(p.unitsSold);
  const sales = num(p.sales); /* إجمالي المبيعات: قيمة يدخلها المستخدم مباشرة */
  const costOfSold = costPerUnit * unitsSold;
  const profit = sales - costOfSold; /* إجمالي الربح */
  const profitPerUnit = sellingPrice - costPerUnit;
  const margin = sales > 0 ? (profit/sales)*100 : 0; /* النسبة المئوية لإجمالي الربح */
  return {materialsCost,wasteCost,samplesCost,totalCost,costPerUnit,unitsSold,sellingPrice,sales,costOfSold,profit,profitPerUnit,margin,batch};
}

/* حساب صافي الربح لمنتج واحد بعد توزيع نصيبه من المصاريف الثابتة (رواتب + مصاريف أخرى)
   بالتناسب مع نصيبه من إجمالي المبيعات. لو مفيش مبيعات مسجلة بيتم توزيع المصاريف بالتساوي. */
function computeNetForProduct(r, ft, totalSales, productCount){
  const fixedShare = totalSales > 0
    ? (r.sales/totalSales) * ft.total
    : (productCount > 0 ? ft.total/productCount : 0);
  const netProfit = r.profit - fixedShare; /* صافي الربح */
  const netMargin = r.sales > 0 ? (netProfit/r.sales)*100 : 0; /* النسبة المئوية لصافي الربح */
  return {fixedShare, netProfit, netMargin};
}

function fixedTotal(){
  const salaries = state.workers.reduce((s,w)=> s + num(w.count)*num(w.salary), 0);
  const other = state.expenses.reduce((s,x)=> s + num(x.amount), 0);
  return {salaries, other, total: salaries+other};
}

/* ============ الاتصال بالباك إند ============ */
function getToken(){ return localStorage.getItem(TOKEN_KEY); }

async function apiFetch(path, options={}){
  const token = getToken();
  const res = await fetch(API_BASE_URL + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { "Authorization": "Bearer " + token } : {}),
      ...(options.headers || {}),
    },
  });
  if(res.status === 401){
    // التوكن بايظ أو خلص، ارجعي لشاشة الدخول
    logout();
    throw new Error("جلستك انتهت، سجّل دخول تاني");
  }
  const data = await res.json().catch(()=> ({}));
  if(!res.ok){ throw new Error(data.message || "حصل خطأ، حاولي تاني"); }
  return data;
}

/* ============ تسجيل الدخول / إنشاء حساب ============ */
function toggleAuthMode(){
  authMode = authMode === "login" ? "signup" : "login";
  renderAuthScreen();
}
function renderAuthScreen(){
  const isSignup = authMode === "signup";
  document.getElementById("auth-title").textContent = isSignup ? "إنشاء حساب جديد" : "تسجيل الدخول";
  document.getElementById("auth-sub").textContent = isSignup
    ? "اعمل حسابك عشان تبدأ تحفظ بياناتك أونلاين"
    : "سجّل دخولك عشان بياناتك تتحفظ أونلاين";
  document.getElementById("auth-signup-fields").style.display = isSignup ? "block" : "none";
  document.getElementById("auth-submit-btn").textContent = isSignup ? "إنشاء الحساب" : "دخول";
  document.getElementById("auth-switch-text").textContent = isSignup ? "عندك حساب بالفعل؟" : "لسه معكش حساب؟";
  document.getElementById("auth-switch-link").textContent = isSignup ? "سجّل دخول" : "اعمل حساب جديد";
  document.getElementById("auth-error").textContent = "";
}
async function submitAuth(){
  const errEl = document.getElementById("auth-error");
  errEl.textContent = "";
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  const name = document.getElementById("auth-name")?.value.trim();

  if(!email || !password){ errEl.textContent = "من فضلك املأي البريد وكلمة المرور"; return; }
  if(authMode === "signup" && !name){ errEl.textContent = "من فضلك اكتب اسمك"; return; }

  const btn = document.getElementById("auth-submit-btn");
  btn.disabled = true;
  btn.textContent = "لحظة...";

  try{
    const path = authMode === "signup" ? "/api/auth/signup" : "/api/auth/login";
    const body = authMode === "signup" ? { name, email, password } : { email, password };
    const res = await fetch(API_BASE_URL + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.message || "حصل خطأ"); }

    localStorage.setItem(TOKEN_KEY, data.token);
    localStorage.setItem(USER_KEY, JSON.stringify({ name: data.name, email: data.email }));

    await enterApp();
  }catch(e){
    errEl.textContent = e.message;
  }finally{
    btn.disabled = false;
    renderAuthScreen();
  }
}
function logout(){
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USER_KEY);
  document.getElementById("app-screen").style.display = "none";
  document.getElementById("auth-screen").style.display = "flex";
  authMode = "login";
  renderAuthScreen();
}
async function enterApp(){
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";
  const user = JSON.parse(localStorage.getItem(USER_KEY) || "{}");
  document.getElementById("who-am-i").textContent = user.name ? ("مرحبًا، " + user.name) : "";
  await loadData();
}

/* ============ حفظ وتحميل بيانات الحاسبة من الباك إند ============ */
async function loadData(){
  try{
    const d = await apiFetch("/api/users/me/calculator");
    state.products = d.products || [];
    state.workers = d.workers || [];
    state.expenses = d.expenses || [];
  }catch(e){ /* أول مرة يفتح فيها البرنامج، مفيش بيانات لسه */ }
  state.products.forEach(p=> expandedProducts.add(p.id));
  document.getElementById("save-status").textContent = "";
  renderTabs();
  renderMain();
}
function scheduleSave(){
  const el = document.getElementById("save-status");
  if(el) el.textContent = "جارِ الحفظ...";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await apiFetch("/api/users/me/calculator", { method:"PUT", body: JSON.stringify(state) });
      if(el) el.textContent = "تم الحفظ ✓";
    }catch(e){
      console.error("save failed", e);
      if(el) el.textContent = "تعذّر الحفظ";
    }
  }, 450);
}

/* ============ التنقل بين التبويبات ============ */
const TABS = [
  {id:"dashboard", label:"لوحة التحكم", icon:"📊"},
  {id:"products", label:"المنتجات والخدمات", icon:"📦"},

/* ============ توصيات الذكاء الاصطناعي ============ */
function renderAI(){
  const resultHtml = aiLoading
    ? `<div class="ai-loading">جارِ تحليل الموضوع وإيجاد أفضل التوصيات...</div>`
    : aiResult
      ? renderAIResult(aiResult)
      : `<div class="hint">اكتب وصف لموقفك الحالي في المشروع، وهيقرأ الذكاء الاصطناعي أرقام حاسبتك تلقائيًا (المبيعات، التكلفة، الهامش) عشان يقولك لو فيه حاجة بتخسرك فلوس، ويقترح مصادر أفضل ومنح ممكن تساعدك.</div>`;

  return `
    <div class="section-head"><h2>نصائح ذكية</h2></div>
    <div class="intro-text">هنقرأ أرقام مشروعك تلقائيًا من الحاسبة (المبيعات، التكلفة، الهامش، المصاريف الثابتة)، ونديك نصيحة لو فيه حاجة ممكن تكون بتخسرك فلوس، ونقترح عليك مصانع أو مورّدين أو متاجر موثوقة (بأماكنها)، وكمان منح أو جهات تمويل ممكن تساعدك.</div>
    <div class="ai-box">
      <input type="text" id="ai-query" placeholder="اكتب وصف لموقفك أو اللي بتعمله دلوقتي في مشروعك" onkeydown="if(event.key==='Enter') runAIRecommend()">
      <button class="btn btn-primary" onclick="runAIRecommend()">بحث</button>
    </div>
    <div id="ai-results">${resultHtml}</div>
  `;
}

function renderAIResult(r){
  if(r.error) return `<div class="ai-loading" style="color:var(--red)">${esc(r.error)}</div>`;

  const adviceHtml = r.advice ? `
    <div class="ai-result-card card" style="border-right:4px solid var(--slate);">
      <h4>نصيحة</h4>
      <div class="item" style="border-top:none; padding-top:0;"><div class="r" style="font-size:14px; color:var(--ink);">${esc(r.advice)}</div></div>
    </div>` : "";

  const section = (title, item) => item ? `
    <div class="ai-result-card card">
      <h4>${title}</h4>
      <div class="item"><div class="n">${esc(item.name)}</div><div class="r">${esc(item.reason||"")}</div></div>
    </div>` : "";

  const list = (title, items) => items && items.length ? `
    <div class="ai-result-card card">
      <h4>${title}</h4>
      ${items.map(i=>`<div class="item"><div class="n">${esc(i.name)}</div><div class="r">${esc(i.reason||"")}</div></div>`).join("")}
    </div>` : "";

  return `
    ${adviceHtml}
    ${section("أفضل منتج", r.bestProduct)}
    ${list("بدائل تانية", r.alternatives)}
    ${section("مُصنّع موثوق", r.trustedManufacturer)}
    ${section("مورّد موثوق", r.trustedSupplier)}
    ${section("متجر موثوق", r.trustedStore)}
    ${list("منح مرتبطة", r.relevantGrants)}
    ${list("جهات تمويل مرتبطة", r.relevantSponsors)}
    ${(!r.advice && !r.bestProduct && !r.alternatives?.length && !r.trustedManufacturer && !r.trustedSupplier && !r.trustedStore && !r.relevantGrants?.length && !r.relevantSponsors?.length)
      ? `<div class="empty">مفيش نتائج مطابقة دلوقتي. جرّب توصف الموقف بشكل مختلف.</div>` : ""}
  `;
}

function buildFinancialsSummary(){
  const ft = fixedTotal();
  let totalSales=0, totalProfit=0;
  const products = state.products.map(p=>{
    const r = computeProduct(p);
    totalSales += r.sales; totalProfit += r.profit;
    return {
      name: p.name || "بدون اسم",
      wastePercent: num(p.wastePercent),
      costPerUnit: Math.round(r.costPerUnit*100)/100,
      sellingPrice: Math.round(r.sellingPrice*100)/100,
      profitPerUnit: Math.round(r.profitPerUnit*100)/100,
      margin: Math.round(r.margin*10)/10,
      unitsSold: r.unitsSold,
      sales: Math.round(r.sales*100)/100,
    };
  });
  const netProfit = totalProfit - ft.total;
  const netMargin = totalSales>0 ? (netProfit/totalSales)*100 : 0;
  return { products, fixedCosts: Math.round(ft.total*100)/100, netProfit: Math.round(netProfit*100)/100, netMargin: Math.round(netMargin*10)/10 };
}

async function runAIRecommend(){
  const query = document.getElementById("ai-query").value.trim();
  if(!query) return;
  aiLoading = true; aiResult = null;
  renderMain();
  try{
    const financials = buildFinancialsSummary();
    aiResult = await apiFetch("/api/ai/recommend", { method:"POST", body: JSON.stringify({ query, financials }) });
  }catch(e){
    aiResult = { error: e.message };
  }finally{
    aiLoading = false;
    renderMain();
    // نرجّع القيمة اللي كتبتها المستخدمة في الخانة بعد إعادة الرسم
    const input = document.getElementById("ai-query");
    if(input) input.value = query;
  }
}

function toggleProduct(id){
  if(expandedProducts.has(id)) expandedProducts.delete(id); else expandedProducts.add(id);
  renderMain();
}
function addProduct(){
  state.products.push({id:uid(), name:"", batchSize:1, sellingPrice:"", priceMode:"fixed", marginPercent:"", unitsSold:"", wastePercent:0, samplesCost:"", sales:"", materials:[]});
  expandedProducts.add(state.products[state.products.length-1].id);
  scheduleSave(); renderMain();
}
function removeProduct(id){
  state.products = state.products.filter(p=>p.id!==id);
  scheduleSave(); renderMain();
}
function updateProductField(id, field, value){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  p[field] = value; scheduleSave();
}
function addMaterial(productId){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  p.materials.push({id:uid(), name:"", qty:"", unit:"كجم", unitPrice:""});
  scheduleSave(); renderMain();
}
function removeMaterial(productId, matId){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  p.materials = p.materials.filter(m=>m.id!==matId);
  scheduleSave(); renderMain();
}
function updateMaterial(productId, matId, field, value){
  const p = state.products.find(x=>x.id===productId); if(!p) return;
  const m = p.materials.find(x=>x.id===matId); if(!m) return;
  m[field] = value; scheduleSave();
}

  const map = {};
  state.products.forEach(p=>{
    p.materials.forEach(m=>{
      if(!m.name) return;
      const key = m.name.trim().toLowerCase()+"|"+m.unit;
      if(!map[key]) map[key] = {name:m.name.trim(), unit:m.unit, qty:0, cost:0, usedIn:new Set()};
      map[key].qty += num(m.qty);
      map[key].cost += num(m.qty)*num(m.unitPrice);
      if(p.name) map[key].usedIn.add(p.name);
    });
  });
  const list = Object.values(map).sort((a,b)=> b.cost-a.cost);
  const totalCost = list.reduce((s,m)=> s+m.cost, 0);
  const rows = list.map(m=>`
    <tr>
      <td style="font-weight:800">${esc(m.name)}</td>
      <td>${fmt(m.qty,3)}</td>
      <td>${esc(m.unit)}</td>
      <td style="color:var(--red)">${fmt(m.cost)} ${CURRENCY}</td>
      <td class="muted" style="font-size:13px;">${[...m.usedIn].map(esc).join("، ")}</td>
    </tr>`).join("");

  return `
    <p class="intro-text">الجدول ده بيجمعلك كل مادة بتستخدمها في أكتر من منتج، وبيديك إجمالي الكمية والتكلفة بتاعتها.</p>
    <div class="section-head"><h2>إجمالي المواد الخام</h2></div>
    <div class="card" style="overflow:hidden;">
      ${list.length===0 ? `<div class="empty">لسه مفيش مواد مسجلة. ضيفها من داخل كل منتج في تبويب "المنتجات والخدمات".</div>` : `
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>المادة</th><th>الكمية الإجمالية</th><th>الوحدة</th><th>التكلفة الإجمالية</th><th>تُستخدم في</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td colspan="3">إجمالي تكلفة كل المواد</td><td style="color:var(--red)">${fmt(totalCost)} ${CURRENCY}</td><td></td></tr></tfoot>
        </table>
      </div>`}
    </div>
  `;
}

/* ============ الرواتب والمصاريف الثابتة ============ */
function renderFixed(){
  const ft = fixedTotal();
  const workerRows = state.workers.map(w=>`
    <div class="row-grid">
      <input value="${esc(w.role)}" placeholder="مثال: عامل إنتاج" oninput="updateWorker('${w.id}','role',this.value)">
      <input type="number" value="${w.count}" oninput="updateWorker('${w.id}','count',this.value)" onblur="renderMain()">
      <input type="number" value="${w.salary}" oninput="updateWorker('${w.id}','salary',this.value)" onblur="renderMain()">
      <span style="font-weight:800;">${fmt(num(w.count)*num(w.salary))}</span>
      <button class="icon-btn" title="حذف" onclick="removeWorker('${w.id}')">🗑</button>
    </div>`).join("");

  const expenseRows = state.expenses.map(x=>`
    <div class="row-grid" style="grid-template-columns:7fr 3fr 32px;">
      <input value="${esc(x.name)}" placeholder="مثال: إيجار المصنع" oninput="updateExpense('${x.id}','name',this.value)">
      <input type="number" value="${x.amount}" oninput="updateExpense('${x.id}','amount',this.value)" onblur="renderMain()">
      <button class="icon-btn" title="حذف" onclick="removeExpense('${x.id}')">🗑</button>
    </div>`).join("");

  return `
    <p class="intro-text">سجّل هنا كل العمالة اللي بتشتغل عندك ومرتباتها، وأي مصروف ثابت بتدفعه شهريًا زي الإيجار أو الكهرباء، حتى لو مش مرتبط بمنتج معين.</p>

    <div class="section-head"><h2>العمالة والرواتب</h2><button class="btn btn-primary" onclick="addWorker()">➕ إضافة وظيفة</button></div>
    <div class="card" style="overflow:hidden; margin-bottom:24px;">
      <div class="row-head"><span>المسمى الوظيفي</span><span>عدد العمال</span><span>راتب الفرد</span><span>الإجمالي</span><span></span></div>
      ${state.workers.length===0 ? `<div class="empty">أضف كل وظيفة وعدد العاملين بيها وراتب الفرد، والبرنامج يجمعلك الإجمالي.</div>` : workerRows}
      <div class="foot-row"><span>إجمالي الرواتب</span><span style="color:var(--red)">${fmt(ft.salaries)} ${CURRENCY}</span></div>
    </div>

    <div class="section-head"><h2>مصاريف ثابتة أخرى</h2><button class="btn btn-primary" onclick="addExpense()">➕ إضافة مصروف</button></div>
    <div class="card" style="overflow:hidden;">
      ${state.expenses.length===0 ? `<div class="empty">مثال: إيجار، كهرباء، مياه، اشتراكات، صيانة.</div>` : expenseRows}
      <div class="foot-row"><span>إجمالي المصاريف الأخرى</span><span style="color:var(--red)">${fmt(ft.other)} ${CURRENCY}</span></div>
    </div>

    <div class="total-banner">
      <span>إجمالي المصاريف الثابتة (رواتب + مصاريف أخرى)</span>
      <span>${fmt(ft.total)} ${CURRENCY}</span>
    </div>
  `;
}
function addWorker(){ state.workers.push({id:uid(), role:"", count:1, salary:""}); scheduleSave(); renderMain(); }
function removeWorker(id){ state.workers = state.workers.filter(w=>w.id!==id); scheduleSave(); renderMain(); }
function updateWorker(id, field, value){ const w = state.workers.find(x=>x.id===id); if(!w) return; w[field]=value; scheduleSave(); }
function addExpense(){ state.expenses.push({id:uid(), name:"", amount:""}); scheduleSave(); renderMain(); }
function removeExpense(id){ state.expenses = state.expenses.filter(x=>x.id!==id); scheduleSave(); renderMain(); }
function updateExpense(id, field, value){ const x = state.expenses.find(i=>i.id===id); if(!x) return; x[field]=value; scheduleSave(); }

(function init(){
  renderAuthScreen();
  if(getToken()){
    enterApp();
  }else{
    document.getElementById("auth-screen").style.display = "flex";
  }
})();
</script>
